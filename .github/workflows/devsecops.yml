name: Pipeline DevSecOps

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/paulohsilveir/ufla-shop
  IMAGE_TAG: ${{ github.sha }}

jobs:
  gitleaks:
    name: Segredos / Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Obter todo o historico Git
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Procurar segredos no historico
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  qualidade:
    name: Testes e SAST / SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Obter todo o historico Git
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de desenvolvimento
        run: pip install --requirement requirements-dev.txt

      - name: Executar lint
        run: ruff check .

      - name: Executar testes e medir cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Analisar codigo e aguardar o Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  dependencias:
    name: Dependencias / Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v7.0.1

      - name: Gerar relatorio completo das dependencias
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .venv
          format: json
          output: trivy-dependencias.json
          exit-code: "0"

      - name: Publicar relatorio das dependencias
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trivy-dependencias
          path: trivy-dependencias.json
          retention-days: 30

      - name: Bloquear vulnerabilidades corrigiveis HIGH ou CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .venv
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  imagem:
    name: Imagem / Trivy, Syft e publicacao
    needs: [gitleaks, qualidade, dependencias]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v7.0.1

      - name: Construir imagem Docker
        run: docker build --tag "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Gerar relatorio completo da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          format: json
          output: trivy-imagem.json
          exit-code: "0"

      - name: Publicar relatorio da imagem
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trivy-imagem
          path: trivy-imagem.json
          retention-days: 30

      - name: Gerar e publicar SBOM da imagem com Syft
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-imagem.spdx.json
          artifact-name: sbom-imagem.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Bloquear vulnerabilidades corrigiveis HIGH ou CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Autenticar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem aprovada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
